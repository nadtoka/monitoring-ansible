---
# roles/monitoring/handlers/main.yml

- name: Restart VictoriaMetrics
  ansible.builtin.command:
    cmd: docker compose restart victoriametrics
    chdir: "{{ docker_compose_dir }}"
  when: is_central | default(false)

- name: Restart Grafana
  ansible.builtin.command:
    cmd: docker compose restart grafana
    chdir: "{{ docker_compose_dir }}"
  when: is_central | default(false)

- name: Restart vmalert
  ansible.builtin.command:
    cmd: docker compose restart vmalert
    chdir: "{{ docker_compose_dir }}"
  when: is_central | default(false)

- name: Restart Alertmanager
  ansible.builtin.command:
    cmd: docker compose restart alertmanager
    chdir: "{{ docker_compose_dir }}"
  when: is_central | default(false)

- name: Restart Blackbox Exporter
  ansible.builtin.command:
    cmd: docker compose restart blackbox-exporter
    chdir: "{{ docker_compose_dir }}"
  when: is_central | default(false)

- name: Restart Google Chat relay
  ansible.builtin.command:
    cmd: docker compose restart alertmanager-gchat-relay
    chdir: "{{ docker_compose_dir }}"
  when: is_central | default(false)

- name: Restart YACE
  ansible.builtin.command:
    cmd: docker compose restart yace
    chdir: "{{ docker_compose_dir }}"
  when:
    - is_central | default(false)
    - vault_aws_yace_access_key is defined
    - vault_aws_yace_secret_key is defined

- name: Restart Postgres Exporter
  ansible.builtin.systemd:
    name: prometheus-postgres-exporter
    state: restarted
  when: has_postgres | default(false)
